<!-- STITCH_THREEJS_START:ANIMATION_16 class="absolute inset-0 w-full h-full bg-transparent pointer-events-auto" -->
<div class="absolute inset-0 w-full h-full bg-transparent pointer-events-auto" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_16" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_16');
  const devicePixelRatio = window.devicePixelRatio || 1;
  const containerElem = container;
const w = containerElem.clientWidth || window.innerWidth;
const h = containerElem.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, w / h, 0.1, 1000);
camera.position.z = 7;

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(w, h);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
containerElem.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 1.1);
scene.add(ambientLight);

const redLight = new THREE.PointLight(0xe62429, 3.2, 25);
redLight.position.set(-4, 3, 4);
scene.add(redLight);

const cyanLight = new THREE.PointLight(0x00e5ff, 2.8, 25);
cyanLight.position.set(4, -2, 3.5);
scene.add(cyanLight);

// Interactive 3D tilt group
const spideyGroup = new THREE.Group();
scene.add(spideyGroup);

// Load the user's transparent cutout PNG directly: IMAGE_1
const textureLoader = new THREE.TextureLoader();
textureLoader.load('{{DATA:IMAGE:IMAGE_1}}', (texture) => {
  texture.minFilter = THREE.LinearFilter;
  texture.magFilter = THREE.LinearFilter;

  // Custom shader for dynamic depth, breathing, chromatic aberration and cybernetic rim glow
  const customMaterial = new THREE.ShaderMaterial({
    transparent: true,
    uniforms: {
      uTexture: { value: texture },
      uTime: { value: 0 },
      uPointer: { value: new THREE.Vector2(0, 0) }
    },
    vertexShader: `
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vPos;
      uniform vec2 uPointer;
      uniform float uTime;
      
      void main() {
        vUv = uv;
        vNormal = normal;
        vec3 pos = position;
        
        // Gentle organic breathing rhythm
        float breath = sin(uTime * 1.8 + pos.y * 1.5) * 0.045;
        pos.z += breath;
        
        // Parallax depth deformation toward pointer/touch
        float dist = distance(vUv, vec2(0.5, 0.5));
        pos.z += sin(dist * 3.14159) * (uPointer.x * 0.16 - uPointer.y * 0.12);

        vPos = pos;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(pos, 1.0);
      }
    `,
    fragmentShader: `
      precision highp float;
      varying vec2 vUv;
      varying vec3 vNormal;
      varying vec3 vPos;
      uniform sampler2D uTexture;
      uniform float uTime;
      uniform vec2 uPointer;
      
      void main() {
        // Dynamic chromatic aberration responsive to movement
        vec2 offsetR = vec2(0.0035 * uPointer.x, 0.0025 * uPointer.y);
        vec2 offsetB = vec2(-0.0035 * uPointer.x, -0.0025 * uPointer.y);
        
        vec4 colOriginal = texture2D(uTexture, vUv);
        float r = texture2D(uTexture, vUv + offsetR).r;
        float g = colOriginal.g;
        float b = texture2D(uTexture, vUv + offsetB).b;
        
        // Keep the natural alpha from the transparent cutout PNG
        float alpha = colOriginal.a;
        if (alpha < 0.02) {
          discard;
        }
        
        vec3 finalColor = vec3(r, g, b);

        // Cyber edge rim lighting along the silhouette (crimson to electric cyan pulse)
        float rim = 1.0 - max(dot(normalize(-vPos), vec3(0.0, 0.0, 1.0)), 0.0);
        vec3 rimCol = mix(vec3(0.92, 0.12, 0.16), vec3(0.0, 0.88, 1.0), sin(uTime * 1.8 + vUv.y * 3.5) * 0.5 + 0.5);
        finalColor += rimCol * pow(rim, 2.5) * 0.5 * alpha;

        // Subtle holographic pulse
        float holo = sin(vUv.y * 180.0 + uTime * 4.0) * 0.03;
        finalColor += vec3(holo) * alpha;

        gl_FragColor = vec4(finalColor, alpha);
      }
    `,
    side: THREE.DoubleSide
  });

  // Cutout aspect ratio is 821x1024 -> ~0.801
  const planeGeo = new THREE.PlaneGeometry(3.6, 4.49, 48, 48);
  const mesh = new THREE.Mesh(planeGeo, customMaterial);
  mesh.position.set(0, -0.05, 0.2);
  spideyGroup.add(mesh);

  // Floating glowing web particles & embers
  const particleCount = 120;
  const pGeometry = new THREE.BufferGeometry();
  const pPositions = new Float32Array(particleCount * 3);

  for(let i = 0; i < particleCount; i++) {
    pPositions[i * 3 + 0] = (Math.random() - 0.5) * 8;
    pPositions[i * 3 + 1] = (Math.random() - 0.5) * 7;
    pPositions[i * 3 + 2] = (Math.random() - 0.5) * 4;
  }

  pGeometry.setAttribute('position', new THREE.BufferAttribute(pPositions, 3));

  const pMaterial = new THREE.PointsMaterial({
    color: 0xff3240,
    size: 0.055,
    transparent: true,
    opacity: 0.75,
    blending: THREE.AdditiveBlending
  });

  const particles = new THREE.Points(pGeometry, pMaterial);
  scene.add(particles);

  // Pointer & Touch tracking
  let targetRotX = 0, targetRotY = 0;

  function updatePointer(normX, normY) {
    targetRotY = normX * 0.32;
    targetRotX = -normY * 0.24;
    if (customMaterial.uniforms) {
      customMaterial.uniforms.uPointer.value.set(normX, normY);
    }
  }

  window.addEventListener('mousemove', (e) => {
    const curW = window.innerWidth;
    const curH = window.innerHeight;
    const normX = (e.clientX / curW) * 2 - 1;
    const normY = -(e.clientY / curH) * 2 + 1;
    updatePointer(normX, normY);
  }, { passive: true });

  window.addEventListener('touchmove', (e) => {
    if (e.touches.length > 0) {
      const curW = window.innerWidth;
      const curH = window.innerHeight;
      const normX = (e.touches[0].clientX / curW) * 2 - 1;
      const normY = -(e.touches[0].clientY / curH) * 2 + 1;
      updatePointer(normX, normY);
    }
  }, { passive: true });

  if (window.DeviceOrientationEvent) {
    window.addEventListener('deviceorientation', (e) => {
      if (e.gamma !== null && e.beta !== null) {
        targetRotY = (e.gamma / 45) * 0.32;
        targetRotX = ((e.beta - 45) / 45) * 0.24;
      }
    }, { passive: true });
  }

  // Animation Loop
  let clock = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    const elapsedTime = clock.getElapsedTime();

    customMaterial.uniforms.uTime.value = elapsedTime;

    // Smooth inertia damping
    spideyGroup.rotation.y += (targetRotY - spideyGroup.rotation.y) * 0.07;
    spideyGroup.rotation.x += (targetRotX - spideyGroup.rotation.x) * 0.07;

    // Subtle idle floating motion
    spideyGroup.position.y = Math.sin(elapsedTime * 1.5) * 0.06;
    spideyGroup.position.x = Math.cos(elapsedTime * 1.0) * 0.03;

    // Floating particles drift
    const pos = pGeometry.attributes.position.array;
    for(let i = 0; i < particleCount; i++) {
      pos[i * 3 + 1] += 0.0035;
      if(pos[i * 3 + 1] > 4) pos[i * 3 + 1] = -3.5;
    }
    pGeometry.attributes.position.needsUpdate = true;
    particles.rotation.y = elapsedTime * 0.016;

    renderer.render(scene, camera);
  }
  animate();
});

// Resize handler
window.addEventListener('resize', () => {
  const newW = containerElem.clientWidth || window.innerWidth;
  const newH = containerElem.clientHeight || window.innerHeight;
  camera.aspect = newW / newH;
  camera.updateProjectionMatrix();
  renderer.setSize(newW, newH);
});
})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_16 -->
